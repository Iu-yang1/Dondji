name: Build Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      preset:
        description: Firmware preset to build
        required: true
        default: CN_RF
        type: choice
        options:
          - CN_RF
          - Custom
          - Fusion
          - Bandscope
          - Broadcast
          - Basic
          - RescueOps
          - Game
          - All

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Compile firmware
      shell: bash
      run: |
        set -euo pipefail
        chmod +x compile-with-docker.sh
        ./compile-with-docker.sh "${{ inputs.preset || 'Custom' }}"

    - name: Upload linker map
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: linker-map-${{ inputs.preset || 'Custom' }}
        path: build/**/*.map
        if-no-files-found: ignore

    - name: Upload firmware artifact
      if: success()
      uses: actions/upload-artifact@v6
      with:
        name: firmware-${{ inputs.preset || 'Custom' }}
        path: build/**/*.bin
        if-no-files-found: error
